[project]
name = "seedvr2x-core"
version = "0.1.0.dev0"
description = "SeedVR2 upscaling library: the model and its files, placement, tiling, colour correction"
# MIT: the shot detector, a brick of the library: TransNetV2's model, vendored, run over frames
# (seedvr2x/detector.py, seedvr2x/transnetv2/; NOTICE).
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "seedvr2x/transnetv2/LICENSE"]
requires-python = ">=3.12"
# Ranges, so that the library runs in another program's environment (DESIGN.md, Repository and
# apps), ComfyUI's first: each floor the version the library's and the nodes' suites pass with in
# the floors' environment (AGENTS.md, Tests), on Python 3.12: torch 2.12.1 and torchvision 0.27.1,
# the ComfyUI instance made for seedvr2x's tests (2026-11-13), a Comfy Desktop's versions where it
# has the other packages (2026-11-12: numpy 2.2.6, Pillow 12.0.0, einops 0.8.0), huggingface-hub
# at the 0.34.0 its transformers 4.57.3 takes (below 1.0), diffusers at the 0.39.0 that takes it
# (0.40 takes 1.23 or later), safetensors at the 0.8.0 diffusers 0.39.0 takes, torchcodec at
# 0.16.0, the first release with the image decoder the library imports (0.12.0, made for torch
# 2.12, to 0.15.0 have none), its CPU build decoding under torch 2.12.1, and the others at the
# CLI's pins; each cap below the next major version, but Pillow's below 14 and huggingface-hub's
# below 3, widened for ComfyUI's environment (pillow 13.0.0, huggingface-hub 2.3.0): the library's
# tests that touch them passed with pillow 13.0.0 and huggingface-hub 2.3.0 and 2.4.0 on 2026-11-05.
# The CLI pins the versions it ships, its references made with them (apps/seedvr2x/pyproject.toml).
# huggingface-hub pulls seedvr2x's own model files (DESIGN.md, Weights), its download held on each
# line, 0.x, 1.x and 2.x (tests/test_pull_lines.py); pillow reads a still picture (DESIGN.md,
# Still images); torchcodec decodes a 16-bit colour PNG, which Pillow cuts to 8 bits,
# torchvision's decoder being deprecated since 0.29 (seedvr2x/picture.py: the only place that
# imports it), and the nodes, which read no file, leave it out (apps/comfyui/README.md, Install).
dependencies = [
    "diffusers>=0.39.0,<1",
    "einops>=0.8.0,<1",
    "huggingface-hub>=0.34.0,<3",
    "numpy>=2.2.6,<3",
    "omegaconf>=2.3.1,<3",
    "pillow>=12.0.0,<14",
    "rotary-embedding-torch>=0.9.1,<1",
    "safetensors>=0.8.0,<1",
    "torch>=2.12.1,<3",
    "torchcodec>=0.16.0,<1",
    "torchvision>=0.27.1,<1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import name stays seedvr2x, the distribution's name being seedvr2x-core (DESIGN.md,
# Repository and apps).
module-name = "seedvr2x"
# No src/ folder: the package sits at core/seedvr2x/ (DESIGN.md, Repository and apps, step 2).
module-root = ""

[tool.uv]
# No environment or lock of its own: the library is checked and tested in the CLI's environment,
# the one shipped (uv run --project ../apps/seedvr2x, from here; AGENTS.md, Layout). Resolved from the
# ranges, uv would make another.
managed = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# The vendored model code is linted apart, for errors only, and TransNetV2's held to its pinned
# bytes: see AGENTS.md, Checks.
exclude = ["seedvr2x/vendor/**", "seedvr2x/transnetv2/**"]

[tool.ruff.format]
# Python only: ruff also formats the code blocks of Markdown files, and the documents are edited
# by hand.
exclude = ["seedvr2x/vendor/**", "seedvr2x/transnetv2/**", "*.md"]

[tool.pyright]
include = ["seedvr2x", "tests", "tools"]
exclude = ["seedvr2x/vendor", "seedvr2x/transnetv2", "**/__pycache__"]
strict = ["seedvr2x"]
pythonVersion = "3.12"
# The library is checked in the CLI's environment, the one shipped (DESIGN.md, Repository and
# apps): see AGENTS.md, Checks.
venvPath = "../apps/seedvr2x"
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not gpu"]
markers = ["gpu: needs CUDA; never selected by default, run with -m gpu"]
