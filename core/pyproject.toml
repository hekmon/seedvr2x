[project]
name = "seedvr2x-core"
version = "0.1.0.dev0"
description = "SeedVR2 upscaling library: the model and its files, placement, tiling, colour correction"
# MIT: TransNetV2's model, vendored, and its windows, rewritten (NOTICE).
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "src/seedvr2x/transnetv2/LICENSE"]
requires-python = "==3.13.*"
# Ranges, so that the library can run in another program's environment (DESIGN.md, Repository
# and apps): from the versions of the numz environment milestone 1 is compared with, which the
# CLI pins (apps/cli/pyproject.toml), to below the next major version. huggingface-hub pulls
# seedvr2x's own model files (DESIGN.md, Weights).
dependencies = [
    "diffusers>=0.40.0,<1",
    "einops>=0.8.2,<1",
    "huggingface-hub>=1.33.0,<2",
    "numpy>=2.5.2,<3",
    "omegaconf>=2.3.1,<3",
    "rotary-embedding-torch>=0.9.1,<1",
    "safetensors>=0.8.0,<1",
    "torch>=2.14.1,<3",
    "torchvision>=0.29.1,<1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import name stays seedvr2x, the distribution's name being seedvr2x-core (DESIGN.md,
# Repository and apps).
module-name = "seedvr2x"

[tool.uv]
# No environment or lock of its own: the library is checked and tested in the CLI's environment,
# the one shipped (uv run --project ../apps/cli, from here; AGENTS.md, Layout). Resolved from the
# ranges, uv would make another.
managed = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# The vendored model code is linted apart, for errors only, and TransNetV2's held to its pinned
# bytes: see AGENTS.md, Checks.
exclude = ["src/seedvr2x/vendor/**", "src/seedvr2x/transnetv2/**"]

[tool.ruff.format]
# Python only: ruff also formats the code blocks of Markdown files, and the documents are edited
# by hand.
exclude = ["src/seedvr2x/vendor/**", "src/seedvr2x/transnetv2/**", "*.md"]

[tool.pyright]
include = ["src", "tests", "tools"]
exclude = ["src/seedvr2x/vendor", "src/seedvr2x/transnetv2", "**/__pycache__"]
strict = ["src/seedvr2x"]
pythonVersion = "3.13"
# The library is checked in the CLI's environment, the one shipped (DESIGN.md, Repository and
# apps): see AGENTS.md, Checks.
venvPath = "../apps/cli"
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not gpu"]
markers = ["gpu: needs CUDA; never selected by default, run with -m gpu"]
