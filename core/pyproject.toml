[project]
name = "seedvr2x-core"
version = "0.1.0.dev0"
description = "SeedVR2 upscaling library: the model and its files, placement, tiling, colour correction"
# MIT: the shot detector, a brick of the library: TransNetV2's model, vendored, run over frames
# (seedvr2x/detector.py, seedvr2x/transnetv2/; NOTICE).
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "seedvr2x/transnetv2/LICENSE"]
requires-python = "==3.13.*"
# Ranges, so that the library can run in another program's environment (DESIGN.md, Repository
# and apps): from the versions of the numz environment milestone 1 is compared with, which the
# CLI pins (apps/seedvr2x/pyproject.toml), to below the next major version. huggingface-hub pulls
# seedvr2x's own model files (DESIGN.md, Weights); pillow reads a still picture (DESIGN.md, Still
# images); torchcodec decodes a 16-bit colour PNG, which Pillow cuts to 8 bits, torchvision's
# decoder being deprecated since 0.29 (seedvr2x/picture.py: the only place that imports it).
# Widened for ComfyUI's environment (pillow 13.0.0, huggingface-hub 2.3.0): the library's tests that
# touch them passed with pillow 13.0.0 and huggingface-hub 2.3.0 and 2.4.0 on 2026-11-05, and
# with the CLI's pins (12.3.0, 1.33.0). seedvr2x/pull.py handles both hub generations.
dependencies = [
    "diffusers>=0.40.0,<1",
    "einops>=0.8.2,<1",
    "huggingface-hub>=1.33.0,<3",
    "numpy>=2.5.2,<3",
    "omegaconf>=2.3.1,<3",
    "pillow>=12.3.0,<14",
    "rotary-embedding-torch>=0.9.1,<1",
    "safetensors>=0.8.0,<1",
    "torch>=2.14.1,<3",
    "torchcodec>=0.17.0,<1",
    "torchvision>=0.29.1,<1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import name stays seedvr2x, the distribution's name being seedvr2x-core (DESIGN.md,
# Repository and apps).
module-name = "seedvr2x"
# No src/ folder: the package sits at core/seedvr2x/ (DESIGN.md, Repository and apps, step 2).
module-root = ""

[tool.uv]
# No environment or lock of its own: the library is checked and tested in the CLI's environment,
# the one shipped (uv run --project ../apps/seedvr2x, from here; AGENTS.md, Layout). Resolved from the
# ranges, uv would make another.
managed = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# The vendored model code is linted apart, for errors only, and TransNetV2's held to its pinned
# bytes: see AGENTS.md, Checks.
exclude = ["seedvr2x/vendor/**", "seedvr2x/transnetv2/**"]

[tool.ruff.format]
# Python only: ruff also formats the code blocks of Markdown files, and the documents are edited
# by hand.
exclude = ["seedvr2x/vendor/**", "seedvr2x/transnetv2/**", "*.md"]

[tool.pyright]
include = ["seedvr2x", "tests", "tools"]
exclude = ["seedvr2x/vendor", "seedvr2x/transnetv2", "**/__pycache__"]
strict = ["seedvr2x"]
pythonVersion = "3.13"
# The library is checked in the CLI's environment, the one shipped (DESIGN.md, Repository and
# apps): see AGENTS.md, Checks.
venvPath = "../apps/seedvr2x"
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not gpu"]
markers = ["gpu: needs CUDA; never selected by default, run with -m gpu"]
