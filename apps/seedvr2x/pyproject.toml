[project]
name = "seedvr2x"
version = "0.1.0.dev0"
description = "SeedVR2 video upscaler for long runs: lossless masters, no seams inside a shot"
readme = "README.md"
# The command's distribution: its code is seedvr2x-core's (NOTICE there).
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = "==3.13.*"
# The library, and the exact versions of the numz environment milestone 1 is compared with
# (DESIGN.md, Validation milestones), so that the comparison differs by code only: bump one on
# purpose, and run that comparison again. huggingface-hub, which pulls seedvr2x's own model files
# (DESIGN.md, Weights), and pillow, which reads a still picture (DESIGN.md, Still images), at the
# versions the lock held already through diffusers and torchvision. torchcodec, which decodes a
# 16-bit colour PNG (Pillow cuts it to 8 bits, torchvision's decoder is deprecated since 0.29;
# seedvr2x/picture.py imports it there alone), from PyPI.
dependencies = [
    "seedvr2x-core",
    "diffusers==0.40.0",
    "einops==0.8.2",
    "huggingface-hub==1.33.0",
    "numpy==2.5.2",
    "omegaconf==2.3.1",
    "pillow==12.3.0",
    "rotary-embedding-torch==0.9.1",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "torchcodec==0.17.0",
    "torchvision==0.29.1",
]

[project.scripts]
seedvr2x = "main:main"

[dependency-groups]
dev = ["gguf==0.19.0", "pyright[nodejs]", "pytest", "ruff"]

# setuptools, not uv's backend, which packages folders only: the CLI is flat, its modules at the
# app's root with no package folder (DESIGN.md, Repository and apps, step 2). Each is listed, and
# tests/test_names.py holds the list to the files and to manifest.MODULES.
[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "calibration",
    "cuts",
    "disk",
    "environment",
    "job",
    "main",
    "manifest",
    "planner",
    "resume",
    "run",
    "scratch",
    "shot",
    "stills",
    "stop",
    "timing",
    "units",
]
packages = ["media"]

[tool.uv]
# Linux first (DESIGN.md). FlashAttention 2 is not a dependency: see AGENTS.md, Environment.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# torch's CUDA support packages, at the versions numz's environment got from PyTorch's index:
# resolved from PyPI, they came out newer (cuda-bindings 13.4.3, cuda-pathfinder 1.8.3,
# nvidia-nvjitlink 13.4.92).
constraint-dependencies = [
    "cuda-bindings==13.3.1",
    "cuda-pathfinder==1.6.0",
    "nvidia-nvjitlink==13.3.33",
]

[tool.uv.sources]
seedvr2x-core = { path = "../../core", editable = true }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
# The library is installed beside the third-party packages, but it is seedvr2x's own: its imports
# sit with the CLI's own modules, as they did when it was one package.
known-first-party = ["seedvr2x"]

[tool.ruff.format]
# Python only: ruff also formats the code blocks of Markdown files, and the documents are edited
# by hand.
exclude = ["*.md"]

[tool.pyright]
include = ["*.py", "media", "tests", "tools"]
exclude = [".venv", "**/__pycache__"]
# The CLI's modules strictly, the tests at the standard level.
strict = ["*.py", "media"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
# The library as source, as the editable install gives it at run time, its tests' helpers
# (pytest's pythonpath below) and its tools (tools/plan_lines.py imports plan_matrix): without
# py.typed, pyright takes an installed package for an untyped one and wants stubs in strict mode.
extraPaths = ["../../core", "../../core/tests", "../../core/tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not gpu"]
markers = ["gpu: needs CUDA; never selected by default, run with -m gpu"]
# The library's test helpers (core/tests: stand_ins, test_colour, library_fixtures, ...), which
# these tests import as the library's own do.
pythonpath = ["../../core/tests"]
