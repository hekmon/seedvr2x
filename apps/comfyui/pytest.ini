[pytest]
testpaths = tests
addopts = --strict-markers -m "not gpu"
markers =
    gpu: needs CUDA; never selected by default, run with -m gpu
# The nodes' package (apps/ holds comfyui/, imported by that name), the library's test helpers
# (core/tests: stand_ins, library_fixtures, test_held), and the stand-in for ComfyUI's few modules
# (comfy, server), which stand in the place of ComfyUI's own, found on the path of ComfyUI's
# process.
pythonpath = .. ../../core/tests tests/comfy_stand_in
